<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>카카오맵 레이아웃</title>
        <style>
            body {
                margin: 0;
            }
            #div1 {
                width: 100%;
                height: 100vh;
                position: relative;
                background-color: purple;
            }
            #bnts {
                position: absolute;
                top: 10px; right: 10px;
                z-index: 10;
                display: flex;
                gap: 1px;
            }
            #map {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                z-index: 1;
                display: block;
            }
            #road {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                z-index: 2;
                display: none;
            }
            #svg {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                z-index: 5;
                pointer-events: none; /* 클릭 이벤트 투과 */
            }
            /* 배관 관경 라벨 스타일 */
            .pipe-s-label {
                font-size: 10px;
                font-weight: bold;
                color: #ff0000;
                white-space: nowrap;
            }
            .pipe-r-label {
                font-size: 10px;
                font-weight: bold;
                color: #ffa000;
                white-space: nowrap;
            }
            /* 로드뷰 좌표 오버레이 공통 스타일 */
            .road-point-overlay {
                padding: 3px 6px;
                border-radius: 50%;
                font-size: 10px;
                font-weight: bold;
                color: #ffffff;
                text-align: center;
                box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.4);
                white-space: nowrap;
            }

            /* S관(공급관) 점 스타일 */
            .road-point-overlay.road-s-point {
                background-color: rgba(255, 0, 0, 0.85);
                border: 1px solid #ffffff;
            }

            /* R관(회수관) 점 스타일 */
            .road-point-overlay.road-r-point {
                background-color: rgba(255, 160, 0, 0.85);
                border: 1px solid #ffffff;
            }

            #camera {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                z-index: 3;
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="div1">
            <div id="bnts">
                <button id="normalBtn" class="btn" onclick="setMapType('normal')">일반</button>
                <button id="skyviewBtn" class="btn" onclick="setMapType('skyview')">위성</button>
                <button id="modeRoadBtn" class="btn" onclick="modeRoad()">거리뷰</button>
                <button id="closeRoadBtn" class="btn" onclick="closeRoadview()" style="display: none;">지도로 돌아가기</button>
                <button id="myLocationBtn" class="btn" onclick="moveToMyLocation()">내위치</button>
                <button id="openCameraBtn" onclick="openCameraView()">카메라 열기</button>
                <button id="closeCameraBtn" onclick="closeCameraView()" style="display: none;">카메라 닫기</button>
            </div>
            <div id="map"></div>
            <div id="road"></div>
            <video id="camera" autoplay playsinline></video>
            <svg id="svg"></svg>
        </div>
        <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d5897e123b57bd103fea6ae3ef98a284&autoload=false"></script>
        <script src="roadViewControl.js"></script>
        <script src="pipeManager.js"></script>
        <script src="cameraView.js"></script>
        <script>
            var map;

            var road;
            var roadClient;
            var roadOn_flag = false;

            var video;

            var svg;

            /*// ★ 데이터 불러오기 중요 로컬에서 임시로 사용
            const fileInput = document.getElementById('csvFile');
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    const csvText = event.target.result;
                    parsePipeCsv(csvText);
                };
                reader.readAsText(file, 'utf-8');
            });*/


            kakao.maps.load(function() {// 처음 시작시
                // 저장된 이전 위치 데이터 가져오기 (없을 경우 기본값: 분당 중심)
                var savedLat = localStorage.getItem('last_lat');
                var savedLng = localStorage.getItem('last_lng');
                var savedLevel = localStorage.getItem('last_level');

                var initialCenter = (savedLat && savedLng) 
                    ? new kakao.maps.LatLng(parseFloat(savedLat), parseFloat(savedLng))
                    : new kakao.maps.LatLng(37.3797697, 127.1159946);// 기본값
                var initialLevel = savedLevel ? parseInt(savedLevel, 10) : 3;

                var options = {center: initialCenter, level: initialLevel};

                // 전역변수 값 주기
                map = new kakao.maps.Map(document.getElementById('map'), options);
                // 무반응 map.setMinLevel(0);// 지도의 최소 레벨을 0으로 설정하여 더 크게 확대 가능하도록 변경
                road = new kakao.maps.Roadview(document.getElementById('road'));
                roadClient = new kakao.maps.RoadviewClient();

                // ★ 데이터 불러오기 중요 서버환경에서만 가능
                loadCsvPipes('bundang/pipe.csv');

                // 지도가 움직이거나 확대/축소될 때 현재 위치를 localStorage에 저장 & 배관 갱신
                kakao.maps.event.addListener(map, 'idle', function() {
                    if (!map) return;
                    var center = map.getCenter();
                    var level = map.getLevel();

                    localStorage.setItem('last_lat', center.getLat());
                    localStorage.setItem('last_lng', center.getLng());
                    localStorage.setItem('last_level', level);

                    updatPipes();
                });

                svg = document.getElementById('svg');
                // 지도 클릭 이벤트 거리뷰 열기
                kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                    if (!roadOn_flag) return;
                    openRoadview(mouseEvent.latLng);
                });

                //로드뷰 이벤트
                kakao.maps.event.addListener(road, 'viewpoint_changed', roadEvent);
                kakao.maps.event.addListener(road, 'position_changed', roadEvent);
                kakao.maps.event.addListener(road, 'panoid_changed', roadEvent);

                video = document.getElementById("camera");
            });

            // 거리뷰 모드 켜고 끄기
            function modeRoad() {
                if (roadOn_flag == true){ 
                    roadOn_flag = false;
                    map.setCursor('grab');
                    map.removeOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
                } else { 
                    roadOn_flag = true;
                    map.setCursor('crosshair');
                    map.addOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
                }
            }

            // 일반/위성 모드 전환
            function setMapType(maptype) {
                if (maptype === 'normal') map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
                else if (maptype === 'skyview')  map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
            }

            // CSV 파일 읽어오기
            function loadCsvPipes(filePath) {
                fetch(filePath)
                    .then(function(response) {
                        if (!response.ok) throw new Error("CSV 파일 로드 실패");
                        return response.text();
                    })
                    .then(function(csvText) {
                        parsePipeCsv(csvText);
                    })
                    .catch(function(error) {
                        console.error("오류 발생:", error);
                    });
            }

            // 스마트폰인지 확인
            function isMobileDevice() {

                return /Android|Phone|iPad|iPod/i.test(navigator.userAgent);
            }
            // 스마트폰에서만 버튼 표시
            function initMobileButtons() {

                if (!isMobileDevice()) {
                    console.log("PC / 노트북");

                    document.getElementById("myLocationBtn").style.display = "none";
                    document.getElementById("openCameraBtn").style.display = "none";
                    document.getElementById("closeCameraBtn").style.display = "none";
                    return;
                }

                console.log("스마트폰");

                document.getElementById("myLocationBtn").style.display = "block";
                document.getElementById("openCameraBtn").style.display = "block";
                document.getElementById("closeCameraBtn").style.display = "none";
            }

            initMobileButtons();

            function moveToMyLocation() {
                console.log("내 위치 버튼 클릭");

                if (!navigator.geolocation) {
                    alert("이 기기에서는 위치 정보를 사용할 수 없습니다.");
                    return;
                }

                navigator.geolocation.getCurrentPosition(

                    function(position) {

                        var lat = position.coords.latitude;
                        var lng = position.coords.longitude;

                        console.log("내 위치");
                        console.log("latitude :", lat);
                        console.log("longitude:", lng);
                        console.log("accuracy :", position.coords.accuracy);

                        if (!map) {
                            console.error("map이 아직 생성되지 않았습니다.");
                            return;
                        }

                        var myPosition = new kakao.maps.LatLng(lat, lng);

                        map.panTo(myPosition);

                    },

                    function(error) {

                        console.error("위치 가져오기 실패:", error);

                        if (error.code === 1) {
                            alert("위치 권한이 허용되지 않았습니다.");
                        }
                        else if (error.code === 2) {
                            alert("현재 위치를 확인할 수 없습니다.");
                        }
                        else if (error.code === 3) {
                            alert("위치 확인 시간이 초과되었습니다.");
                        }

                    },

                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            }
        </script>
    </body>
</html>
